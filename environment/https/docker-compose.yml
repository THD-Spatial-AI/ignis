# HTTPS environment, building ignis and build-db from source in this
# checkout, so it is the only one of the three here that picks up local code
# changes. Use docker-compose.quickstart.yml to try the API without a source
# tree, or docker-compose.prod.yml to deploy a published release.
#
# ---
# Usage:  docker compose up -d
#         docker compose --profile seed run --rm build-db
# ---
#
# Caddy terminates TLS in front of the app and does nothing else: ignis handles
# its own CORS and preflight, and no request carries an API key. Use
# environment/http/ where TLS is terminated upstream, or not needed; that path
# needs no `caddy` install and no trust step.
#
# Host prerequisites beyond Docker: the `caddy` CLI, with `caddy trust` run
# once, so the local CA in CADDY_DATA_DIR is in your OS and browser trust
# store and https://localhost is trusted without a warning. The quickstart
# file skips this at the cost of a certificate warning.
#
# .env must define (interpolated on the host, not passed into containers):
#   CADDY_DATA_DIR   host directory holding the caddy trust-installed CA.
#                    No default on purpose: a wrong value silently produces
#                    an untrusted certificate, so a missing one should fail
#                    validation instead.
#   APP_PORT         optional, defaults to 8080
#   HOST_HTTPS_PORT  optional, defaults to 443
#
# Compose project name. This is the unit Compose takes destructive action
# against, not a label for related things: `down --remove-orphans` removes every
# container carrying the project label, including ones declared in another
# repository's compose file. Scoped per repository and per transport for that
# reason; buem-gateway declares its own rather than sharing this one.
name: ignis-https

# Container naming convention: <service>-<role>, where role is one of
# reverse-proxy | app | db. Service name and container_name are kept identical.
# A container name says both which service it belongs to and what role it
# plays. Container names are unique across the host whatever the project is
# called, which is what stops the http and https environments running at once.
services:
  db:
    image: postgres:17-alpine
    env_file: [env/db.env]        # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - db-data:/var/lib/postgresql/data   # persists across container recreation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    # No `ports:` mapping — reachable only from other containers on this
    # network, by service name (`db`), same as the app itself.

  ignis:
    build:
      # Context is the repository root, two levels up. The dockerfiles stay at
      # environment/ rather than being copied into http/ and https/: the image
      # is identical for both, and .github/workflows/docker-publish.yml builds
      # from that one path.
      context: ./../..
      dockerfile: environment/ignis-app.dockerfile   # multi-stage: builder (Go toolchain) -> final (binary only)
    env_file: [env/common.env, env/app.env]        # CORS config + DB connection
    environment:
      - APP_PORT=${APP_PORT:-8080}    # internal listen port; one value for the app, its health check and the proxy
    depends_on:
      db:
        condition: service_healthy
    # No `ports:` mapping here on purpose — the app is not reachable from the
    # host directly. Only the reverse proxy is exposed; everyone else must go through it.
    # No `command:` override needed — the image's own CMD runs the server
    # directly now; this is a single-purpose image, not a shared toolbox.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$$APP_PORT/ignis/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # One-off DB seed/rebuild job, NOT part of the normal `up` path (see
  # `profiles` below). build_db DROPS and recreates all country tables from
  # the Excel workbook — invoke deliberately, never automatically on startup:
  #   docker compose --profile seed run --rm build-db
  # No `container_name`: this is only ever started via `run`, which assigns
  # its own name, and a fixed one would collide rather than help.
  build-db:
    profiles: ["seed"]
    build:
      context: ./../..
      dockerfile: environment/ignis-db.dockerfile
    # No volume mount for the workbook — tabula-calculator-lite.xlsx is baked
    # into the image itself (see ignis-db.dockerfile), since it's static
    # reference data, not something that changes independently of a release.
    env_file: [env/app.env]
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2.11-alpine
    env_file: [env/proxy.env]       # IGNIS_SITE_ADDRESS
    environment:
      - APP_PORT=${APP_PORT:-8080}    # so the Caddyfile's upstream ignis:{$APP_PORT} resolves
    depends_on:
      ignis:
        condition: service_healthy
    ports:
      - "${HOST_HTTPS_PORT:-443}:443" # public entry point; host side assignable per service
    volumes:
      # Directory mount, not per-file: most editors save by writing a temp
      # file and renaming over the original, which gives it a new inode. A
      # single-file bind mount stays bound to the old inode, so the
      # container keeps serving stale content and no Caddy restart fixes it.
      - ./caddy:/etc/caddy:ro
      - ${CADDY_DATA_DIR:?CADDY_DATA_DIR is not set}:/data/caddy # reuse the host's already-trusted local CA
    # No entrypoint or command override: the caddy image already runs
    # `caddy run --config /etc/caddy/Caddyfile --adapter caddyfile`.

volumes:
  # Project-scoped, so http and https hold separate databases. They can run at
  # the same time, and two Postgres containers must never share one data
  # directory. Seed each environment once; the data is rebuilt from the
  # workbook, so a second copy costs disk rather than provenance.
  db-data:
