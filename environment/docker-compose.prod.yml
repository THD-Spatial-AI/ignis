# Deploy-time compose file: pulls the pre-built, CI-published ignis-app
# image instead of building from source (this machine has no Go toolchain,
# no source tree — only this file + .env/docker.env + Caddyfile).
# Usage:  docker compose -f docker-compose.prod.yml up -d
#
# Deliberately standalone rather than a partial override merged with
# docker-compose.yml: Compose's merge rules mean a service left with BOTH
# `build:` (from the base file) and `image:` (from an override) can still
# fall back to building locally if no matching image is cached — exactly
# the thing this file exists to avoid on a source-less deploy target.
#
# ignis-build-db (the one-off DB rebuild tool) is intentionally not
# included here — it's a rare, manual admin operation, not part of the
# normal deploy path, and still requires a source checkout to build.
name: building-simulation

services:
  ignis-db:
    image: postgres:17-alpine
    container_name: ignis-db
    env_file: docker.env
    volumes:
      - ignis-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  ignis-app:
    container_name: ignis-app
    # Pre-built by .github/workflows/docker-publish.yml on each vX.Y.Z tag.
    # Set IGNIS_IMAGE_TAG in .env to pin a version; defaults to `latest`.
    image: ghcr.io/thd-spatial-ai/ignis:${IGNIS_IMAGE_TAG:-latest}
    env_file: docker.env
    environment:
      - APP_PORT=${APP_PORT}
    depends_on:
      ignis-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$$APP_PORT/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  ignis-reverse-proxy:
    image: caddy:2.11-alpine
    container_name: ignis-reverse-proxy
    env_file: docker.env
    environment:
      - APP_PORT=${APP_PORT}
    depends_on:
      ignis-app:
        condition: service_healthy
    ports:
      - "${HOST_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_DIR}:/data/caddy
    entrypoint:
      - sh
      - -c
      - >
        export ALLOWED_ORIGINS_PATTERN="^($$(echo "$$ALLOWED_ORIGINS" | sed -e 's/[.]/\\./g' -e 's/,/|/g'))$$" &&
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  ignis-db-data:
