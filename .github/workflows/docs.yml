name: MkDocs

on:
  push:
    branches:
      - master
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    uses: THD-Spatial-AI/.github/.github/workflows/mkdocs-pages.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      openapi-spec: docs/openapi/openapi.yaml
