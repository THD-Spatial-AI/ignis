name: Publish Docker image

# Deliberate release trigger, not every commit: a pushed vX.Y.Z tag, or a
# manual run from the Actions tab. This is the "Package" step of the CI
# pipeline chain (Checkout -> Compile -> Test -> Build -> Package -> E2E ->
# Deployable System) — go.yml already covers Compile/Test; this covers
# Package (build the image, tag it, push it to a registry).
on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/thd-spatial-ai/ignis

jobs:
  build-and-push:
    name: Build & push ignis-app image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          REF_TAG="${GITHUB_REF_NAME}"
          echo "tags=${IMAGE_NAME}:${REF_TAG},${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build & push (multi-stage Dockerfile, environment/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: environment/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
